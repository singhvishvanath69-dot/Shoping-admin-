<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Short Buy एडमिन</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#f3f6f5;color:#12211f;line-height:1.5}
header{position:sticky;top:0;background:#0f766e;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:5}
header h1{font-size:20px;flex:1;font-weight:800}
input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #c5d3d0;width:100%;background:#fff}
input[type=radio],input[type=checkbox]{width:auto}
label{display:flex;gap:8px;align-items:center}
button{background:#0f766e;color:#fff;border:0;cursor:pointer}
button:disabled{background:#9aa9a6}
button.o{background:#fff;color:#0f766e;border:1px solid #0f766e}
button.r{background:#b91c1c}
header button,.sm{width:auto;padding:8px 12px}
header button{background:#fff;color:#0f766e;font-weight:700}
main{padding:12px 12px 90px;max-width:900px;margin:auto;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c,.box{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;border:1px solid #dbe5e3}
label.box{flex-direction:row;align-items:flex-start}
.c img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e2ebe9}
.c span{color:#b45309;font-weight:800}
.c small{color:#4d6360;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
#sh{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#sh>div{background:#fff;margin-top:6vh;height:94vh;border-radius:16px 16px 0 0;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
#sh>div>*{flex-shrink:0}
.tl{display:flex;gap:2px;font-size:12px;text-align:center}
.tl span{flex:1;padding:4px 2px;border-top:4px solid #c5d3d0;color:#6b7f7c}
.tl .on{border-color:#0f766e;color:#0f766e;font-weight:700}
.tag{font-size:13px;color:#4d6360}
.pv{width:96px;border-radius:8px;object-fit:cover}
.ph{display:flex;gap:6px;overflow-x:auto}
.ph img{height:120px;border-radius:8px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{width:auto;white-space:nowrap;background:#fff;color:#0f766e;border:1px solid #0f766e}
.tabs .on{background:#0f766e;color:#fff}
.fab{position:fixed;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 10px #0004;z-index:6}
hr{border:0;border-top:1px dashed #9aa9a6}</style></head><body>
<header><h1><a href="index.html" style="color:inherit;text-decoration:none">🛡️ Short Buy एडमिन</a></h1><button id="lb" class="sm">लॉगिन</button></header>
<main>
<div id="gate" class="box"><b>एडमिन लॉगिन</b><button onclick="login()">Google से लॉगिन</button></div>
<div id="deny" class="box" hidden><b>आप एडमिन नहीं हैं</b><span>Firebase Console → Firestore में <code>admins</code> कलेक्शन बनाएँ और इस UID के नाम से एक डॉक्यूमेंट जोड़ें:</span><code id="uid" style="word-break:break-all"></code></div>
<div id="app" hidden>
<div id="st" class="grid"></div>
<div id="tb" class="tabs" style="margin:10px 0"></div>
<div id="v" class="col"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-analytics-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCkblGm-Esda5VbOZYkpQpHsBePhxen8hk",authDomain:"psb-chtting.firebaseapp.com",projectId:"psb-chtting",storageBucket:"psb-chtting.firebasestorage.app",messagingSenderId:"689058791105",appId:"1:689058791105:web:e8a528524c004546415e40",measurementId:"G-F6VW5EGSHL"};
firebase.initializeApp(firebaseConfig);
try{firebase.analytics()}catch(e){}
const db=firebase.firestore(),auth=firebase.auth();
const $=s=>document.querySelector(s);
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const login=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
const ts=t=>t&&t.toDate?t.toDate().toLocaleDateString('hi-IN'):'';
const arr=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
const TL=['नया','पैक हुआ','भेजा गया','डिलीवर हुआ'];
const tl=o=>o.status=='रद्द'?'<b>❌ रद्द</b>':`<div class="tl">${TL.map((t,k)=>`<span class="${k<=TL.indexOf(o.status)?'on':''}">${t}</span>`).join('')}</div>`;
const imgs=p=>(p.imgs&&p.imgs.length?p.imgs:[p.img]).filter(Boolean);
const fmt=a=>[a.vi,a.ci,a.di,a.st,a.pin].filter(Boolean).join(', ');
const S=['नया','पैक हुआ','भेजा गया','डिलीवर हुआ','रद्द'];
let U=null,O=[],P=[],R=new Set(),SL={},tab='o',unsub=[];
$('#lb').onclick=()=>U?auth.signOut():login();
auth.onAuthStateChanged(async u=>{
U=u;unsub.forEach(f=>f());unsub=[];
$('#lb').textContent=u?'लॉगआउट':'लॉगिन';$('#gate').hidden=!!u;$('#app').hidden=true;$('#deny').hidden=true;
if(!u)return;
let ok=false;try{ok=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
if(!ok){$('#uid').textContent=u.uid;$('#deny').hidden=false;return}
$('#app').hidden=false;
unsub.push(
db.collection('orders').onSnapshot(s=>{O=arr(s);draw()}),
db.collection('products').onSnapshot(s=>{P=arr(s);draw()}),
db.collection('receipts').onSnapshot(s=>{R=new Set(s.docs.map(d=>d.id));draw()}),
db.collection('sellers').onSnapshot(s=>{SL={};s.docs.forEach(d=>SL[d.id]=d.data());draw()}));
});
const amtO=o=>o.sellerAmount??o.total??0;
function draw(){
const pa=O.filter(o=>o.status=='डिलीवर हुआ'&&o.sellerState!='rejected'&&o.payStatus!='paid'),dn=O.filter(o=>o.payStatus=='paid');
$('#st').innerHTML=[['कुल ऑर्डर',O.length],['नए ऑर्डर',O.filter(o=>o.status=='नया').length],['प्रोडक्ट',P.length],['मंजूरी बाकी',P.filter(p=>p.public&&!p.approved).length],['सेलर',Object.keys(SL).length],['कुल बिक्री',rs(O.filter(o=>o.status!='रद्द').reduce((a,o)=>a+(o.total||0),0))],['सेलर को देना बाकी',rs(pa.reduce((a,o)=>a+amtO(o),0))]].map(([k,v])=>`<div class="c"><span>${v}</span>${k}</div>`).join('');
$('#tb').innerHTML=[['o','ऑर्डर'],['p','प्रोडक्ट'],['s','सेलर'],['b','पेमेंट बाकी ('+pa.length+')'],['d','पेमेंट पूरा ('+dn.length+')']].map(([k,t])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${t}</button>`).join('');
$('#v').innerHTML=({o:orders,p:prods,s:sellers,b:()=>pa.map(o=>payCard(o,0)).join('')||'कोई पेमेंट बाकी नहीं',d:()=>dn.map(o=>payCard(o,1)).join('')||'अभी कोई पेमेंट पूरा नहीं'})[tab]();
}
const SS={pending:'⏳ सेलर की मंजूरी बाकी',accepted:'✅ सेलर ने स्वीकार किया',rejected:'❌ सेलर ने अस्वीकार किया'};
const orders=()=>O.map(o=>`<div class="box"><b>${esc(o.name)}</b> · ${esc(o.phone)}<span>${esc(o.address)}</span><span>${(o.items||[]).map(i=>esc(i.name)+' ×'+i.qty+' ('+esc(i.sellerName||'सेलर')+')').join(', ')}</span><b>${rs(o.total)}</b><span class="tag">${SS[o.sellerState]||''}</span><button class="sm" onclick="cp('${o.id}')">📋 Delhivery के लिए कॉपी करें</button><div class="row"><input id="a_${o.id}" placeholder="Delhivery ट्रैकिंग नंबर (AWB)" value="${esc(o.awb||'')}"><button class="sm" onclick="saveAwb('${o.id}')">सेव</button></div><select onchange="st('${o.id}',this.value)">${S.map(x=>`<option ${x==o.status?'selected':''}>${x}</option>`).join('')}</select>${o.status=='डिलीवर हुआ'?[...new Set((o.items||[]).map(i=>i.sellerId))].map(sid=>R.has(o.id+'_'+sid)?'<span class="tag">✅ डिलीवरी रसीद सेलर को भेजी जा चुकी है</span>':`<button onclick="sendR('${o.id}','${sid}')">🧾 सेलर को डिलीवरी रसीद भेजें</button>`).join(''):''}</div>`).join('')||'अभी कोई ऑर्डर नहीं';
const prods=()=>[...P].sort((a,b)=>(a.approved?1:0)-(b.approved?1:0)).map(p=>`<div class="box"><div class="row"><img class="pv" style="width:64px" src="${esc(imgs(p)[0])}" alt=""><span style="flex:1">${p.public&&!p.approved?'🆕 ':''}<b>${esc(p.name)}</b><br><span class="tag">${esc(p.sellerName)} · ${p.public?(p.approved?'✅ शॉप में लाइव':'⏳ मंजूरी बाकी'):'🔒 Private (सेलर ने छिपाया)'} · स्टॉक ${p.stock}</span></span></div><span class="tag">सेलर की कीमत: ${rs(p.price)} (सेलर को यही मिलेगी)</span><div class="row"><input id="sp_${p.id}" type="number" value="${p.salePrice||p.price}"><button class="sm" onclick="setP('${p.id}')">${p.approved?'कीमत सेव':'✅ कीमत सेव करके मंजूर करें'}</button></div>${p.approved?`<button class="sm o" onclick="hideP('${p.id}')">🙈 शॉप से छिपाएँ</button>`:''}<button class="sm r" onclick="delP('${p.id}')">हटाएँ</button></div>`).join('')||'अभी कोई प्रोडक्ट नहीं';
const sellers=()=>Object.entries(SL).map(([id,s])=>`<div class="box"><b>${esc(s.shop)}</b><span>${esc(s.gname)} · ${esc(s.email)}</span><span>मोबाइल: ${esc(s.mobile)}</span><span>पता: ${esc(s.addrText)}</span><span>A/c: ${esc(s.acc)} · IFSC: ${esc(s.ifsc)}</span><span class="tag">${P.filter(p=>p.sellerId==id).length} प्रोडक्ट · जुड़ा: ${ts(s.createdAt)}</span></div>`).join('')||'अभी कोई सेलर नहीं जुड़ा';
const payCard=(o,paid)=>{const sl=SL[(o.sellerIds||[])[0]]||{},it=(o.items||[])[0]||{},p=P.find(x=>x.id==it.id)||{};
return `<div class="box"><div class="row"><img class="pv" style="width:64px" src="${esc(imgs(p)[0])}" alt=""><span style="flex:1"><b>${esc(it.name)}</b> ×${it.qty}<br><span class="tag">${esc(p.desc)}</span></span><b>${rs(amtO(o))}</b></div><span>सेलर: ${esc(sl.shop||it.sellerName)} · ${esc(sl.email)}</span><span>A/c: ${esc(sl.acc)} · IFSC: ${esc(sl.ifsc)}</span>${paid?`<b>UTR: ${esc(o.utr)}</b>`:`<button onclick="payDone('${o.id}')">✅ पूरा हुआ</button>`}</div>`};
function payDone(id){const u=prompt('UTR नंबर डालें');if(!u||!u.trim())return;db.collection('orders').doc(id).update({payStatus:'paid',utr:u.trim(),paidAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>alert('सेव नहीं हुआ: '+e.message))}
function setP(id){const v=+$('#sp_'+id).value;if(!v)return alert('सही कीमत डालें');db.collection('products').doc(id).update({salePrice:v,priceSet:true,approved:true}).catch(e=>alert(e.message))}
function hideP(id){db.collection('products').doc(id).update({approved:false}).catch(e=>alert(e.message))}
function delP(id){if(confirm('यह प्रोडक्ट हटाएँ?'))db.collection('products').doc(id).delete()}
function st(id,v){db.collection('orders').doc(id).update({status:v})}
function cp(id){const o=O.find(x=>x.id==id),t='नाम: '+o.name+'\nमोबाइल: '+o.phone+'\nपता: '+o.address+'\nसामान: '+o.items.map(i=>i.name+' ×'+i.qty).join(', ')+'\nCOD रकम: '+o.total;
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('कॉपी हो गया ✅')).catch(()=>prompt('इसे कॉपी करें:',t))}
function saveAwb(id){const v=$('#a_'+id).value.trim();if(!v)return alert('ट्रैकिंग नंबर (AWB) डालें');const o=O.find(x=>x.id==id),u={awb:v};
if(['नया','पैक हुआ'].includes(o.status))u.status='भेजा गया';db.collection('orders').doc(id).update(u).catch(e=>alert('सेव नहीं हुआ: '+e.message))}
function sendR(oid,sid){const o=O.find(x=>x.id==oid),it=o.items.filter(i=>i.sellerId==sid);
db.collection('receipts').doc(oid+'_'+sid).set({orderId:oid,sellerId:sid,sellerName:it[0]?.sellerName||'',items:it,amount:it.reduce((a,i)=>a+(i.sp??i.price)*i.qty,0),customer:o.name,address:o.address,sentBy:U.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>alert('रसीद नहीं गई: '+e.message))}
</script></body></html>
